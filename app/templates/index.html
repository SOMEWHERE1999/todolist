<!DOCTYPE html>
<html lang="en" ng-app="todoApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AngularJS TodoList</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body ng-controller="TodoController as vm">
    <div class="container py-4">
        <h1 class="mb-4">AngularJS TodoList</h1>
        <div class="card mb-3">
            <div class="card-body">
                <form class="row g-2" ng-submit="vm.addTodo()">
                    <div class="col-md-6">
                        <input type="text" class="form-control" placeholder="Add New" ng-model="vm.newTitle" required>
                    </div>
                    <div class="col-md-3">
                        <input type="date" class="form-control" ng-model="vm.newDueDate">
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-primary w-100">Add</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Status</th>
                            <th>Due Date</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="todo in vm.todos">
                            <td>{{ todo.title }}</td>
                            <td>
                                <select class="form-select form-select-sm" ng-model="todo.status" ng-change="vm.updateTodo(todo)">
                                    <option value="pending">Pending</option>
                                    <option value="completed">Completed</option>
                                </select>
                            </td>
                            <td>{{ todo.due_date | date:'yyyy-MM-dd' }}</td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-danger" ng-click="vm.removeTodo(todo)">Remove</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
